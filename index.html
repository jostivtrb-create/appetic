<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icons/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#ED7D2B" />
    <meta name="description" content="Appetic — el menú digital de tu barrio. Mira el menú y pide en segundos." />

    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Appetic" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!-- Fuentes -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <!-- Tipografías de marca por local (Pilotos: stencil militar + condensada · JUANCE: Anton) -->
    <link href="https://fonts.googleapis.com/css2?family=Saira+Stencil+One&family=Oswald:wght@400;500;600;700&family=Barlow+Condensed:wght@400;500;600;700&family=Anton&display=swap" rel="stylesheet" />
    <!-- Fruti Tentación: redondeadas y alegres (Fredoka títulos · Nunito texto) -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <!-- Leñita Casera: letra de letrero de madera (Alfa Slab One títulos) -->
    <link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&display=swap" rel="stylesheet" />

    <title>Appetic — el menú de tu barrio</title>
  </head>
  <body>
    <script>
      // 📲 Antes de que el navegador lea el manifest: en el link de un local, el suyo (api/manifest.js),
      // para que lo que se instale sea ese local con su ícono. Lista espejo de src/utils/instalacion.js.
      (function () {
        var s = location.pathname.split('/')[1] || ''
        var no = ['api', 'assets', 'icons', 'locales', 'cuenta', 'pedidos', 'favoritos', 'datos', 'superadmin', 'domiciliario', 'r', 'p', 'cartilla', 'propuesta', 'planes', 'barberia', 'demo-servicios']
        if (!/^[a-z0-9-]{2,60}$/.test(s) || no.indexOf(s) >= 0) return
        var m = document.querySelector('link[rel="manifest"]')
        if (m) m.href = '/' + s + '/manifest.webmanifest'
        var a = document.querySelector('link[rel="apple-touch-icon"]')
        if (a) a.href = '/api/icono?slug=' + s + '&t=180&p=apple'
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
