<!DOCTYPE html>
<!--
  ╔══════════════════════════════════════════════════════════════════════╗
  ║  PLANTILLA DE CUESTIONARIO · skill /Mega-Cuestionario                 ║
  ║                                                                      ║
  ║  Copia este archivo a  <proyecto>/.mega-cuestionario/                 ║
  ║  y toca SOLO la ZONA DE EDICIÓN del <script> (META, CERRADO,          ║
  ║  SUGERENCIAS, PREGUNTAS) y el <title>. Nada más.                      ║
  ║                                                                      ║
  ║  NO quitar el respaldo execCommand del botón copiar: abriendo el      ║
  ║  archivo con file:// Chrome bloquea navigator.clipboard y sin el      ║
  ║  respaldo el botón NO FUNCIONA.                                      ║
  ╚══════════════════════════════════════════════════════════════════════╝
-->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mega-Cuestionario · Ronda N</title>
<style>
  :root{
    --bg:#0e0f13; --panel:#161821; --panel-2:#1d2030; --line:#2a2e40;
    --txt:#e9ecf5; --muted:#9aa2bd; --accent:#7c5cff; --accent-2:#22d3ee;
    --ok:#34d399; --idea:#fbbf24;
  }
  *{box-sizing:border-box}
  body{
    margin:0; padding:24px 16px 120px; background:var(--bg); color:var(--txt);
    font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  .wrap{max-width:820px;margin:0 auto}
  header{
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    border-radius:18px; padding:22px; color:#0b0c10; margin-bottom:18px;
  }
  header h1{margin:0 0 6px; font-size:24px; letter-spacing:-.4px}
  header p{margin:0; font-weight:600; opacity:.82; font-size:14px}
  .aviso{
    background:var(--panel); border:1px solid var(--line); border-left:4px solid var(--accent-2);
    border-radius:12px; padding:14px 16px; margin-bottom:18px; color:var(--muted); font-size:14px;
  }
  .aviso b{color:var(--txt)}
  .aviso code{color:var(--accent-2); font-size:12.5px}
  .cerrado{border-left-color:var(--ok); font-size:13.5px}
  .cerrado ul{margin:8px 0 0; padding-left:18px}
  .ideas{border-left-color:var(--idea); margin-bottom:26px}
  .ideas h3{margin:0 0 4px; color:var(--idea); font-size:15px}
  .ideas>p{margin:0 0 14px; font-size:13px}
  .idea{background:var(--panel-2); border:1px solid var(--line); border-radius:12px; padding:13px; margin-top:10px}
  .idea-t{color:var(--txt); font-weight:700; font-size:15px}
  .idea-d{font-size:13px; margin:3px 0 10px}
  .mini{display:flex; gap:8px; flex-wrap:wrap}
  .mini label{
    background:var(--bg); border:1px solid var(--line); border-radius:9px; padding:7px 12px;
    cursor:pointer; font-size:14px; color:var(--txt); display:flex; gap:7px; align-items:center;
  }
  .mini label.sel{border-color:var(--idea); background:#2e2612}
  .mini input{accent-color:var(--idea)}
  .q{
    background:var(--panel); border:1px solid var(--line); border-radius:16px;
    padding:18px; margin-bottom:16px;
  }
  .q.resp{border-color:var(--accent)}
  .q-head{display:flex; gap:12px; align-items:flex-start; margin-bottom:6px}
  .num{
    flex:0 0 28px; height:28px; border-radius:9px; background:var(--panel-2);
    display:grid; place-items:center; font-size:13px; font-weight:700; color:var(--accent-2);
  }
  .q.resp .num{background:var(--accent); color:#fff}
  .q-title{font-weight:700; font-size:17px; letter-spacing:-.2px}
  .q-help{color:var(--muted); font-size:13.5px; margin:2px 0 14px 40px}
  .opts{display:flex; flex-direction:column; gap:8px; margin-left:40px}
  label.opt{
    display:flex; gap:10px; align-items:flex-start; background:var(--panel-2);
    border:1px solid var(--line); border-radius:11px; padding:11px 13px; cursor:pointer;
    transition:.15s; font-size:15px;
  }
  label.opt:hover{border-color:var(--accent)}
  label.opt.sel{border-color:var(--accent); background:#241f3d}
  label.opt input{margin-top:3px; accent-color:var(--accent); flex:0 0 auto}
  .opt small{display:block; color:var(--muted); font-size:12.5px; margin-top:2px}
  .obs{margin:12px 0 0 40px}
  .obs span{display:block; font-size:12px; color:var(--muted); margin-bottom:5px; font-weight:600; letter-spacing:.3px}
  /* Observaciones dentro de una idea: sin sangría (no hay número que compensar)
     y en ámbar, para que se lea como parte del bloque de ideas y no de las preguntas. */
  .idea .obs{margin:10px 0 0}
  .idea .obs span{color:var(--idea); opacity:.75}
  .idea .obs textarea{min-height:46px; font-size:14px}
  .idea .obs textarea:focus{border-color:var(--idea)}
  textarea,input[type=text]{
    width:100%; background:#0f111a; color:var(--txt); border:1px solid var(--line);
    border-radius:10px; padding:10px 12px; font:inherit; font-size:14.5px; resize:vertical;
  }
  textarea:focus,input[type=text]:focus{outline:none; border-color:var(--accent)}
  textarea{min-height:58px}
  .otro{margin-top:8px}
  .bar{
    position:fixed; left:0; right:0; bottom:0; background:rgba(14,15,19,.94);
    border-top:1px solid var(--line); padding:14px 16px; backdrop-filter:blur(8px);
  }
  .bar-in{max-width:820px; margin:0 auto; display:flex; gap:12px; align-items:center}
  .prog{flex:1; font-size:13px; color:var(--muted)}
  .prog b{color:var(--txt)}
  .track{height:6px; background:var(--panel-2); border-radius:4px; margin-top:6px; overflow:hidden}
  .fill{height:100%; width:0; background:linear-gradient(90deg,var(--accent),var(--accent-2)); transition:.3s}
  button{
    background:linear-gradient(135deg,var(--accent),var(--accent-2)); color:#0b0c10; border:0;
    border-radius:12px; padding:13px 20px; font:inherit; font-weight:800; cursor:pointer; font-size:15px;
  }
  button:active{transform:scale(.97)}
  button.ghost{background:var(--panel-2); color:var(--muted); font-weight:600; padding:13px 14px}
  #toast{
    position:fixed; left:50%; bottom:92px; transform:translateX(-50%) translateY(20px);
    background:var(--ok); color:#06281c; padding:12px 20px; border-radius:12px; font-weight:700;
    opacity:0; pointer-events:none; transition:.25s; z-index:9;
  }
  #toast.on{opacity:1; transform:translateX(-50%) translateY(0)}
  #salida{
    width:100%; min-height:220px; margin-top:14px; display:none;
    font-family:ui-monospace,Menlo,Consolas,monospace; font-size:13px;
  }
  @media(max-width:560px){
    .q-help,.opts,.obs{margin-left:0}
    body{padding:16px 12px 130px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="h-titulo"></h1>
    <p id="h-sub"></p>
  </header>

  <div class="aviso cerrado" id="bloque-cerrado" style="display:none">
    <b>✅ Ya cerrado en rondas anteriores</b> (no se vuelve a tocar):
    <ul id="lista-cerrado"></ul>
  </div>

  <div class="aviso" id="bloque-intro"></div>

  <div class="aviso ideas" id="bloque-ideas" style="display:none">
    <h3>💡 Cosas que quizá no pensaste</h3>
    <p>No son preguntas del cuestionario: son cosas que noté y que tú no mencionaste. Descártalas sin culpa.</p>
    <div id="ideas"></div>
  </div>

  <div id="preguntas"></div>

  <textarea id="salida" readonly></textarea>
</div>

<div class="bar">
  <div class="bar-in">
    <div class="prog">
      <span><b id="hechas">0</b> de <b id="total">0</b> respondidas</span>
      <div class="track"><div class="fill" id="fill"></div></div>
    </div>
    <button class="ghost" onclick="limpiar()">Borrar</button>
    <button onclick="copiar()">📋 Copiar respuestas</button>
  </div>
</div>
<div id="toast">✅ Copiado — pégalo en el chat</div>

<script>
/* ══════════════════ ZONA DE EDICIÓN — solo esto se cambia ══════════════════ */

const META = {
  id:      "planes-por-tamano-r1",
  tarea:   "Planes de Appetic por tamaño de negocio",
  ronda:   1,
  nombre:  "VISIÓN GENERAL",
  intro:   "Esta ronda son <b>preguntas grandes</b>: cuántos planes hay, qué lleva el de entrada, cuánto vale y en qué pieza se vende.<br>" +
           "Nada de colores, nombres ni textos todavía; eso va después, sobre lo que sobreviva.<br>" +
           "Hoy la propuesta tiene <b>Desarrollador $5M + $1M/mes · Empresario $189.000 · Emprendedor $99.000</b>, y los tres apuntan a restaurantes con salón.<br>" +
           "Si algo te da igual, marca <b>“No sé / decide tú”</b>. Al final pulsa <b>Copiar respuestas</b> y pégalas en el chat."
};

const CERRADO = [];

const SUGERENCIAS = [
  { t:"Vender el plan de entrada como la «puerta» y no como un plan recortado",
    d:"Es la misma app: subir de plan es activar mesas y cocina, sin migrar nada ni volver a montar el menú. Ese argumento («empiezas chico y creces sin cambiar de app») hace que el plan barato no se sienta de segunda." },
  { t:"Para tráilers y carritos, el gancho es la FILA, no el domicilio",
    d:"Muchos no tienen domiciliario. Lo que les duele es la gente esperando para pedir: el cliente escanea el QR, arma su pedido mientras espera y al dueño le llega completo. Podría ser el ángulo principal del plan de entrada." },
  { t:"Precio por pago anual o semestral",
    d:"Un local chico prefiere un pago chico; uno mediano agradece un descuento por pagar varios meses. Da caja de entrada y reduce los que se van al segundo mes." },
  { t:"Contabilidad ≠ factura electrónica de la DIAN",
    d:"Si el dueño oye «contabilidad» puede entender factura electrónica, que tiene requisitos legales y proveedores autorizados. Conviene decir claro qué incluye y qué no para no vender algo que no podemos entregar." },
  { t:"Lo que pasa con el 2×1 hasta el 31 de diciembre",
    d:"Hoy corre en los tres planes. Si el plan de entrada es muy barato, el 2×1 casi lo regala; quizá conviene dejarlo solo en los planes de arriba o cambiarlo por otra cosa en el de entrada." }
];

const PREGUNTAS = [
  { t:"¿Cómo queda la escalera de planes?",
    h:"Decide cuántos planes hay y qué pasa con los tres de hoy. Todo lo demás cuelga de aquí.",
    tipo:"unica",
    o:[
      {v:"3 por tamaño: Entrada · Restaurante (mesas + cocina) · Completo (+ contabilidad)", d:"Simple de explicar en la calle. El Desarrollador y el chatbot salen o se vuelven extras. Recomendado: es lo que describiste."},
      {v:"3 por tamaño + el Desarrollador arriba como ancla (4 en total)", d:"Conserva el truco del plan carísimo que hace ver barato todo lo demás. Una tarjeta más que explicar."},
      {v:"2 planes por tamaño + contabilidad como añadido que se suma a cualquiera", d:"El plan de entrada y el de restaurante; la contabilidad se vende aparte cuando exista. Menos promesa sobre algo que no está hecho."}
    ]},
  { t:"¿Qué lleva el plan de entrada (locales chicos y tráilers)?",
    h:"Solo existencia de cada pieza, no cómo se ve. Todas ya existen en la app. Lo que no marques queda para los planes de arriba.",
    tipo:"multiple",
    o:[
      {v:"Menú digital con fotos y QR", d:"La base. Sin esto no hay plan."},
      {v:"Pedido completo al WhatsApp del local", d:"El argumento más conocido de Appetic."},
      {v:"Panel del dueño para cambiar precios, agotados y horario"},
      {v:"Menú del día"},
      {v:"Domicilios con cobro por distancia y panel del domiciliario", d:"Si lo pones aquí, el que tenga domiciliario no tiene por qué subir de plan."},
      {v:"Aparecer en el buscador del barrio"},
      {v:"Comandas: seguir cada pedido y marcarlo «ya se cobró»", d:"Hoy va pegado a la cocina; en un tráiler puede servir como lista de pedidos."},
      {v:"Fotos de los platos hechas con IA"}
    ]},
  { t:"¿Cuánto cuesta el plan de entrada al mes?",
    h:"Mueve toda la escalera: el de restaurante y el completo se calculan desde aquí. Contexto: los locales de $18.900 nunca pagaron, y un local dijo que no a $50.000.",
    tipo:"unica",
    o:[
      {v:"$29.900", d:"Casi sin fricción. Hay que vender muchos para que dé."},
      {v:"$39.900", d:"Menos que una comida para dos. Recomendado: deja aire para que el de restaurante quede en $99.000."},
      {v:"$49.900", d:"Cerca del «no» a $50.000 que ya hubo."},
      {v:"Gratis con límite (ej. X pedidos al mes) y se paga al pasarse", d:"Entra cualquiera, pero ya viste que «gratis» tampoco garantiza uso."}
    ]},
  { t:"¿El plan de restaurante (mesas + cocina) se queda en $99.000?",
    h:"Es lo que hoy vale el Emprendedor, que ya trae mesas, cocina, domicilios y comandas.",
    tipo:"unica",
    o:[
      {v:"Sí, $99.000 — es el Emprendedor de hoy con otro nombre", d:"Nada que recalcular; la propuesta actual ya lo vende así."},
      {v:"Bajarlo (ej. $79.000) para que el salto desde el de entrada sea menor"},
      {v:"Subirlo, porque ahora hay un plan más barato que lo hace ver completo"}
    ]},
  { t:"¿Cómo se vende la contabilidad, que todavía no existe?",
    h:"Ya pasó con el mesero y la cocina (se vendieron antes de programarse). Aquí decides si se repite.",
    tipo:"unica",
    o:[
      {v:"Como si ya existiera, igual que se hizo con mesero y cocina", d:"Vende más fuerte. Si alguien lo compra, hay que programarla contra reloj."},
      {v:"Como «próximamente», con precio de lanzamiento para el que se anote ya", d:"Honesto y crea lista de espera; puede vender menos."},
      {v:"No se muestra hasta que exista", d:"Entonces la escalera tiene un plan menos por ahora."}
    ]},
  { t:"¿Qué es «contabilidad» para ese plan, a grandes rasgos?",
    h:"Solo qué piezas existen. Si es «decide tú», propongo caja del día + gastos + reporte mensual, sin DIAN.",
    tipo:"multiple",
    o:[
      {v:"Cierre de caja del día (cuánto entró por efectivo, Nequi, tarjeta)"},
      {v:"Registro de gastos y compras"},
      {v:"Inventario de insumos"},
      {v:"Reporte mensual de ganancia (ventas − gastos)"},
      {v:"Factura electrónica DIAN", d:"Trámite legal y proveedor autorizado. Lo más difícil de cumplir."}
    ]},
  { t:"¿En qué pieza se vende todo esto?",
    h:"Al dueño de un tráiler no le sirven 8 páginas sobre mesas y cocina. Ojo: el 27-oct decidiste «nada de folleto, todo es la propuesta» (P8); si eliges algo distinto, lo cambiamos a propósito.",
    tipo:"unica",
    o:[
      {v:"Una sola propuesta para todos, con los planes al final", d:"Lo de hoy. Lo más fácil de mantener, pero el chico lee mucho de lo que no le aplica."},
      {v:"Dos piezas: una corta para locales chicos y la propuesta larga para restaurantes", d:"Cada dueño ve lo suyo. Recomendado para la calle."},
      {v:"Una pieza corta con los planes para la calle, que remite a la propuesta larga si el local es grande"}
    ]}
];

/* ════════════════════ FIN ZONA DE EDICIÓN — no tocar debajo ════════════════════ */

const ID = META.id;
document.title = `Mega-Cuestionario · Ronda ${META.ronda} · ${META.nombre}`;
document.getElementById('h-titulo').textContent = `🧠 Mega-Cuestionario · Ronda ${META.ronda}`;
document.getElementById('h-sub').textContent = `${META.nombre} — ${META.tarea}`;
document.getElementById('bloque-intro').innerHTML = META.intro +
  '<div class="q-help" style="margin-top:10px">💡 ¿Marcaste una opción por error? Tócala otra vez y se desmarca.</div>';

if(CERRADO.length){
  document.getElementById('bloque-cerrado').style.display='block';
  document.getElementById('lista-cerrado').innerHTML = CERRADO.map(c=>`<li>${c}</li>`).join('');
}

/* El autoguardado NUNCA puede tumbar la página.
   `localStorage` no siempre está: en un visor de archivos dentro de una app
   (móvil, web), en un iframe en sandbox o en una ventana privada, el simple
   hecho de TOCARLO lanza una excepción. Sin esta protección, la excepción
   saltaba aquí —antes de pintar las sugerencias y las preguntas— y el
   cuestionario salía con la cabecera y nada más: ni una pregunta, "0 de 0".
   Guardar es una comodidad; enseñar las preguntas es la razón de existir del
   archivo. Si hay que perder una, se pierde la comodidad. */
const MEM = {
  leer(){ try{ return JSON.parse(localStorage.getItem(ID) || "{}"); }catch(e){ return {}; } },
  escribir(d){ try{ localStorage.setItem(ID, JSON.stringify(d)); }catch(e){} },
  borrar(){ try{ localStorage.removeItem(ID); }catch(e){} }
};
const guardado = MEM.leer();

if(SUGERENCIAS.length){
  document.getElementById('bloque-ideas').style.display='block';
  document.getElementById('ideas').innerHTML = SUGERENCIAS.map((s,i)=>{
    const n=i+1;
    return `<div class="idea">
      <div class="idea-t">${s.t}</div>
      ${s.d?`<div class="idea-d">${s.d}</div>`:''}
      <div class="mini">
        ${["👍 Sí, inclúyelo","👎 No","🤔 Quizá más adelante"].map(v=>
          `<label><input type="radio" name="s${n}" value="${v}">${v}</label>`).join('')}
      </div>
      <div class="obs"><span>OBSERVACIONES</span><textarea id="sobs${n}" data-n="${n}" placeholder="Matices, condiciones, o por qué no (opcional)"></textarea></div>
    </div>`;
  }).join('');
}

const cont = document.getElementById('preguntas');
PREGUNTAS.forEach((p,i)=>{
  const n = i+1;
  const div = document.createElement('div');
  div.className='q'; div.id='q'+n;
  let html = `<div class="q-head"><div class="num">${n}</div><div class="q-title">${p.t}</div></div>`;
  if(p.h) html += `<div class="q-help">${p.h}</div>`;
  if(p.tipo!=='texto'){
    const tipoIn = p.tipo==='multiple' ? 'checkbox' : 'radio';
    html += `<div class="opts">`;
    p.o.forEach(o=>{
      html += `<label class="opt"><input type="${tipoIn}" name="q${n}" value="${o.v.replace(/"/g,'&quot;')}" data-n="${n}">
        <div><span>${o.v}</span>${o.d?`<small>${o.d}</small>`:''}</div></label>`;
    });
    html += `<label class="opt"><input type="${tipoIn}" name="q${n}" value="🤷 No sé / decide tú" data-n="${n}">
      <div><span>🤷 No sé / decide tú</span><small>Confío en tu criterio para esta</small></div></label>`;
    html += `<label class="opt"><input type="${tipoIn}" name="q${n}" value="__otro__" data-n="${n}">
      <div><span>✏️ Otro (lo escribo yo)</span></div></label>`;
    html += `<input type="text" class="otro" id="otro${n}" placeholder="Escribe tu propia respuesta…" data-n="${n}" style="display:none">`;
    html += `</div>`;
  } else {
    html += `<div class="opts"><textarea id="libre${n}" data-n="${n}" placeholder="Escribe aquí…" style="min-height:100px"></textarea></div>`;
  }
  html += `<div class="obs"><span>OBSERVACIONES / MATICES</span><textarea id="obs${n}" data-n="${n}" placeholder="Algo que quieras aclarar sobre esta pregunta (opcional)"></textarea></div>`;
  div.innerHTML = html;
  cont.appendChild(div);
});

document.getElementById('total').textContent = PREGUNTAS.length;

Object.entries(guardado).forEach(([k,v])=>{
  if(k.startsWith('sel') || k.startsWith('sug')){
    const sel = k.startsWith('sug') ? `input[name=s${k.slice(3)}]` : `input[name=q${k.slice(3)}]`;
    document.querySelectorAll(sel).forEach(el=>{ if([].concat(v).includes(el.value)) el.checked=true; });
  } else { const el=document.getElementById(k); if(el) el.value=v; }
});

function estado(){
  const d={};
  PREGUNTAS.forEach((p,i)=>{
    const n=i+1;
    if(p.tipo!=='texto'){
      const sel=[...document.querySelectorAll(`input[name=q${n}]:checked`)].map(e=>e.value);
      if(sel.length) d['sel'+n]=sel;
    }
    ['obs','otro','libre'].forEach(pre=>{
      const el=document.getElementById(pre+n);
      if(el && el.value.trim()) d[pre+n]=el.value;
    });
  });
  SUGERENCIAS.forEach((s,i)=>{
    const n=i+1, el=document.querySelector(`input[name=s${n}]:checked`);
    if(el) d['sug'+n]=el.value;
    // Las observaciones de una idea se guardan aunque no haya Sí/No marcado:
    // un "esto depende de…" escrito vale igual que una respuesta.
    const ta=document.getElementById('sobs'+n);
    if(ta && ta.value.trim()) d['sobs'+n]=ta.value;
  });
  return d;
}

function refrescar(){
  const d=estado();
  MEM.escribir(d);
  let hechas=0;
  PREGUNTAS.forEach((p,i)=>{
    const n=i+1;
    const ok = p.tipo==='texto' ? !!d['libre'+n] : !!d['sel'+n];
    document.getElementById('q'+n).classList.toggle('resp', ok);
    if(ok) hechas++;
  });
  document.querySelectorAll('label.opt, .mini label').forEach(l=>l.classList.toggle('sel', l.querySelector('input').checked));
  PREGUNTAS.forEach((p,i)=>{
    const n=i+1, inp=document.getElementById('otro'+n);
    if(!inp) return;
    inp.style.display = document.querySelector(`input[name=q${n}][value="__otro__"]:checked`) ? 'block' : 'none';
  });
  document.getElementById('hechas').textContent=hechas;
  document.getElementById('fill').style.width=(hechas/PREGUNTAS.length*100)+'%';
}
// Un radio marcado por error se puede DESMARCAR tocándolo otra vez. El navegador
// no lo hace solo, y sin esto una respuesta equivocada se queda pegada para siempre.
// Hay que recordar el estado ANTES del click: cuando llega el 'click' ya está marcado.
let radioAntes = null;
document.addEventListener('pointerdown', e => {
  const t = e.target instanceof Element ? e.target : null;
  const inp = t && (t.matches('input[type=radio]') ? t : t.closest('label')?.querySelector('input[type=radio]'));
  radioAntes = inp ? { inp, estaba: inp.checked } : null;
});
// Solo se escucha el click del PROPIO input: si se desmarcara en el click de la
// <label>, la activación por defecto lo volvería a marcar justo después.
document.addEventListener('click', e => {
  const inp = e.target;
  if (!(inp instanceof HTMLInputElement) || inp.type !== 'radio') return;
  if (!radioAntes || radioAntes.inp !== inp || !radioAntes.estaba) return;
  inp.checked = false;
  radioAntes = null;
  refrescar();
});

document.addEventListener('input', refrescar);
refrescar();

function texto(){
  const d=estado();
  let s=`=== MEGA-CUESTIONARIO · RONDA ${META.ronda} (${META.nombre}) · ${META.tarea} ===\n`;
  PREGUNTAS.forEach((p,i)=>{
    const n=i+1;
    s+=`\n[${n}] ${p.t}\n`;
    if(p.tipo==='texto'){
      s+=`  R: ${d['libre'+n] || '(sin responder)'}\n`;
    } else {
      const sel=(d['sel'+n]||[]).map(v=> v==='__otro__' ? `Otro: ${d['otro'+n]||'(vacío)'}` : v);
      s+=`  R: ${sel.length ? sel.join(' | ') : '(sin responder)'}\n`;
    }
    if(d['obs'+n]) s+=`  Obs: ${d['obs'+n]}\n`;
  });
  if(SUGERENCIAS.length){
    s+=`\n--- COSAS QUE QUIZÁ NO PENSASTE ---\n`;
    SUGERENCIAS.forEach((sg,i)=>{
      s+=`[S${i+1}] ${sg.t} → ${d['sug'+(i+1)] || '(sin responder)'}\n`;
      if(d['sobs'+(i+1)]) s+=`  Obs: ${d['sobs'+(i+1)]}\n`;
    });
  }
  s+=`\n=== FIN RONDA ${META.ronda} ===`;
  return s;
}

function copiar(){
  const t=texto();
  const done=()=>{ const el=document.getElementById('toast'); el.classList.add('on'); setTimeout(()=>el.classList.remove('on'),2200); };
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(t).then(done).catch(()=>fallback(t,done));
  } else fallback(t,done);   // ← file:// cae aquí SIEMPRE. No borrar.
}
function fallback(t,done){
  const ta=document.getElementById('salida');
  ta.style.display='block'; ta.value=t; ta.select(); ta.setSelectionRange(0,999999);
  try{ document.execCommand('copy'); done(); }
  catch(e){ alert('Selecciona el texto de abajo y cópialo a mano (Ctrl+C).'); }
  ta.scrollIntoView({behavior:'smooth'});
}
function limpiar(){
  if(!confirm('¿Borrar todas las respuestas?')) return;
  MEM.borrar();
  // Recargar tampoco está garantizado (un visor en sandbox lo bloquea), así
  // que se vacía el formulario a mano y la recarga queda como un extra.
  document.querySelectorAll('#preguntas input, #ideas input').forEach(el=>{
    if(el.type==='radio'||el.type==='checkbox') el.checked=false; else el.value='';
  });
  document.querySelectorAll('textarea').forEach(t=>{ t.value=''; });
  document.querySelectorAll('.otro').forEach(i=>{ i.style.display='none'; });
  refrescar();
  try{ location.reload(); }catch(e){}
}
</script>
</body>
